<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline | Nkwapa</title>
    <style>
      :root {
        --background: hsl(54 63% 97%);
        --foreground: hsl(200 25% 15%);
        --card: hsl(50 33% 98%);
        --primary: hsl(188 100% 27%);
        --primary-foreground: hsl(0 0% 100%);
        --muted-foreground: hsl(200 10% 40%);
        --border: hsl(45 20% 87%);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: hsl(200 25% 8%);
          --foreground: hsl(54 20% 92%);
          --card: hsl(200 20% 11%);
          --primary: hsl(188 80% 47%);
          --primary-foreground: hsl(200 25% 8%);
          --muted-foreground: hsl(200 10% 60%);
          --border: hsl(200 15% 20%);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--background);
        color: var(--foreground);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 28rem;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted-foreground);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }
      button {
        min-height: 44px;
        padding: 0 16px;
        border-radius: 6px;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      .primary {
        border: 0;
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .secondary {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--foreground);
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        This page has not been opened on this device yet, so it cannot load without a connection.
      </p>
      <p>Anything you saved is safe on this device and will sync when the connection returns.</p>
      <div class="actions">
        <button class="primary" type="button" onclick="history.back()">Go back</button>
        <button class="secondary" type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
