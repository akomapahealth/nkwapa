# Keycloak sends the patient their password-setup link, so these messages sit beside the
# invite the API sends and must not look like they came from somewhere else.
#
# Only the shell and the execute-actions content are overridden. Everything else -- email
# verification, password reset -- inherits the parent templates and picks up the branding
# from html/template.ftl for free.
parent=keycloak
locales=en
