# Patient-facing wording for the account-setup journey.
#
# These screens sit between the invitation email and the claim page, and Keycloak's own
# copy is written for someone administering an account rather than a patient setting one
# up for the first time. "Perform the following action(s): Update Password, Verify Email"
# is accurate and means nothing to the person reading it.

# The confirmation screen the action link opens on.
requiredAction.UPDATE_PASSWORD=Choose a password
requiredAction.VERIFY_EMAIL=Confirm your email address

# The screen shown once every action is done. This is the hand-off back to Nkwapa, so it
# reads as the next step rather than as a dead end with a link in the corner.
accountUpdatedTitle=Your account is ready
accountUpdatedMessage=Your password is saved and your email address is confirmed. Sign in with your new password to finish opening your record.
backToApplication=Continue to Nkwapa

# Expired, used and invalid links (#277). Keycloak's defaults ("Action expired.", "An error
# occurred, please login again through your application.") say something went wrong and stop.
# Each of these says what happened and the one thing to do next. The failed sign-in message is
# left alone on purpose: it must not say whether the account exists.
expiredActionMessage=This link has expired. Sign in to carry on, or ask for a new link.
expiredActionTokenNoSessionMessage=This link has expired or has already been used. If you have already chosen a password, go back to sign in. Otherwise ask whoever sent it for a new one.
expiredActionTokenSessionExistsMessage=This link has expired. Open the most recent email you were sent and use its link instead.
invalidTokenRequiredActions=This link is not valid. Ask whoever sent it for a new one.
expiredCodeMessage=Sign-in took too long, so it was stopped to keep your account safe. Please sign in again.
invalidCodeMessage=This link or page is no longer valid. If it came from an email, ask whoever sent it for a new one. Otherwise go back to Nkwapa and sign in again.
staleCodeMessage=This page is no longer valid. Go back to Nkwapa and sign in again.
cookieNotFoundMessage=Your browser did not keep the sign-in details for this page. Check that cookies are allowed for this site, then go back to Nkwapa and sign in again.
differentUserAuthenticated=Someone else is signed in on this browser ({0}). Sign them out of Nkwapa, then open your link again.
pageExpiredTitle=This page has expired
pageExpiredExplanation=Sign-in pages time out after a while, to keep accounts safe. Nothing has been changed.
pageExpiredRestart=Start signing in again
pageExpiredContinue=Carry on where I was
updatePasswordTitle=Choose your password
emailForgotTitle=Reset your password
doForgotPassword=Forgot password?
# The page an invitation link opens on. Keycloak's "Perform the following action(s)" was both
# its title and its only sentence.
confirmExecutionOfActions=Set up your Nkwapa account
backToLogin=Back to sign in
