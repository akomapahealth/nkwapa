# infra/nkwapa/docker-compose.yml
name: nkwapa

services:
  postgres:
    image: postgres:16
    container_name: nkwapa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nkwapa}
      POSTGRES_USER: ${POSTGRES_USER:-nkwapa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nkwapa}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nkwapa} -d ${POSTGRES_DB:-nkwapa}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: nkwapa-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: nkwapa-keycloak
    command: ['start-dev', '--import-realm']
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/realm-export:/opt/keycloak/data/import:ro
      - ./keycloak/themes/nkwapa:/opt/keycloak/themes/nkwapa:ro
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-ec',
          'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /realms/nkwapa/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *" 200 "* ]]',
        ]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
