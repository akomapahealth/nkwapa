name: Deploy

on:
  push:
    branches: [main, release/dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  # ──────────────────────────────────────────────
  # Database Migration
  # ──────────────────────────────────────────────
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Run migrations
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::notice::DATABASE_URL secret is not set for this environment; skipping Prisma migrate deploy."
            exit 0
          fi
          npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ──────────────────────────────────────────────
  # Deploy Frontend to Vercel
  # ──────────────────────────────────────────────
  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check Vercel token
        id: vercel-token
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel CLI secrets are not fully configured; skipping Vercel CLI deploy. Vercel Git integration may still deploy this branch."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.vercel-token.outputs.present == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        if: steps.vercel-token.outputs.present == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        working-directory: apps/web

      - name: Build for Vercel
        if: steps.vercel-token.outputs.present == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        working-directory: apps/web

      - name: Deploy to Vercel
        if: steps.vercel-token.outputs.present == 'true'
        id: deploy-web
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - name: Post deployment URL
        if: steps.vercel-token.outputs.present == 'true'
        run: |
          echo "### Web deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy-web.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Post skipped web deployment
        if: steps.vercel-token.outputs.present != 'true'
        run: |
          echo "### Web deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped Vercel CLI deploy because Vercel CLI secrets are not fully configured." >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Deploy API to Render
  # ──────────────────────────────────────────────
  deploy-api:
    name: Deploy API (Render)
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Trigger Render API deploy
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            HOOK_URL="${{ secrets.RENDER_API_PRODUCTION_DEPLOY_HOOK_URL }}"
            TARGET_ENV="production"
          else
            HOOK_URL="${{ secrets.RENDER_API_STAGING_DEPLOY_HOOK_URL }}"
            TARGET_ENV="staging"
          fi

          if [ -z "${HOOK_URL}" ]; then
            echo "::notice::Render API deploy hook is not set for ${TARGET_ENV}; skipping API deploy."
            exit 0
          fi

          curl --fail --silent --show-error --request POST "${HOOK_URL}"

      - name: Post deployment summary
        run: |
          echo "### API deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered Render API deploy (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Deploy Auth to Render
  # ──────────────────────────────────────────────
  deploy-auth:
    name: Deploy Auth (Render)
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Trigger Render auth deploy
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            HOOK_URL="${{ secrets.RENDER_AUTH_PRODUCTION_DEPLOY_HOOK_URL }}"
            TARGET_ENV="production"
          else
            HOOK_URL="${{ secrets.RENDER_AUTH_STAGING_DEPLOY_HOOK_URL }}"
            TARGET_ENV="staging"
          fi

          if [ -z "${HOOK_URL}" ]; then
            echo "::notice::Render auth deploy hook is not set for ${TARGET_ENV}; skipping auth deploy."
            exit 0
          fi

          curl --fail --silent --show-error --request POST "${HOOK_URL}"

      - name: Post deployment summary
        run: |
          echo "### Auth deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered Render auth deploy (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Tag release on main
  # ──────────────────────────────────────────────
  # Semantic versions from the merged PR's release:* label (#202, scripts/next-version.mjs).
  # Runs only after every deploy succeeds, so a failed deploy is never tagged. A re-run reuses
  # the tag already on the commit and only creates the GitHub Release if it is missing.
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [deploy-web, deploy-api, deploy-auth]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The labels of the PR merged as this commit; empty for a direct push to main (no PR).
          PR_LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merge_commit_sha == env.GITHUB_SHA) | .labels | map(.name)][0]')
          PLAN=$(PR_LABELS="$PR_LABELS" node scripts/next-version.mjs release)

          SKIP=$(jq -r '.skip // empty' <<<"$PLAN")
          if [ -n "$SKIP" ]; then
            echo "::warning::${SKIP}"
            echo "### Release not tagged: ${SKIP}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TAG=$(jq -r .tag <<<"$PLAN")
          PREVIOUS=$(jq -r '.previous // empty' <<<"$PLAN")
          if [ "$(jq -r .isNew <<<"$PLAN")" = "true" ]; then
            # git refuses a tag that already exists, so two releases can never share a version.
            git tag "$TAG"
            git push origin "$TAG"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # A full release marked Latest, so the repo page shows it; a pre-release can never be
            # Latest. "(beta)" in the title still says where Nkwapa is.
            gh release create "$TAG" --verify-tag --latest --title "$TAG (beta)" \
              --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
          fi
          echo "### Release: $TAG" >> "$GITHUB_STEP_SUMMARY"
