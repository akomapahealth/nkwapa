name: CI

on:
  pull_request:
  push:
    branches: [main, release/dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://nkwapa:nkwapa@localhost:5432/nkwapa

jobs:
  # ──────────────────────────────────────────────
  # Lint & Format
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Build @nkwapa/db
        run: npm run build --workspace=@nkwapa/db

      - name: ESLint
        run: npm run lint --workspaces --if-present

      - name: Prettier check
        run: npx prettier --check .

  # ──────────────────────────────────────────────
  # Typecheck
  # ──────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Build @nkwapa/db
        run: npm run build --workspace=@nkwapa/db

      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces --if-present

  # ──────────────────────────────────────────────
  # Unit Tests (with Postgres service)
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Matches the Postgres service; explicit so migrate + Prisma always see DATABASE_URL
      DATABASE_URL: postgresql://nkwapa:nkwapa@localhost:5432/nkwapa
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nkwapa
          POSTGRES_USER: nkwapa
          POSTGRES_PASSWORD: nkwapa
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nkwapa -d nkwapa"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma migrate deploy
        run: npm run db:migrate:deploy

      - name: Build @nkwapa/db
        run: npm run build --workspace=@nkwapa/db

      - name: Run tests with coverage
        run: npm run test --workspaces --if-present -- --coverage --ci
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/api/coverage/
            apps/web/coverage/
            packages/db/coverage/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Security audit
  # ──────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate || true

  # ──────────────────────────────────────────────
  # Build (depends on lint + typecheck + test)
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Build @nkwapa/db
        run: npm run build --workspace=@nkwapa/db

      - name: Build all workspaces
        run: npm run build --workspaces --if-present

      - name: Upload API build
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: apps/api/dist/
          retention-days: 7

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7
